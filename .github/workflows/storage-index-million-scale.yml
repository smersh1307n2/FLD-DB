name: Storage index 1M scale gate

on:
  # One-million-entry scale gate is an explicit milestone check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-index-million-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore bench/Fld1.Engine.Bench/Fld1.Engine.Bench.csproj
      - name: Build scale harness
        run: dotnet build bench/Fld1.Engine.Bench/Fld1.Engine.Bench.csproj --configuration Release --no-restore
      - name: Run 1M-entry B+ tree scale gate and capture peak RSS
        shell: bash
        run: |
          /usr/bin/time -v -o storage-index-million-time.txt dotnet run --project bench/Fld1.Engine.Bench/Fld1.Engine.Bench.csproj --configuration Release --no-build --no-restore -- --storage-index-million-scale
      - name: Verify scale report and peak RSS
        run: python3 eng/verify-storage-index-million-scale.py
      - name: Upload scale diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-index-million-scale-${{ github.sha }}
          path: |
            storage-index-million-scale.json
            storage-index-million-time.txt
          if-no-files-found: error
          retention-days: 30
