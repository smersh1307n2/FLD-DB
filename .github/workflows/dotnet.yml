name: .NET CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Full cross-platform durability validation (UTC)
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  # Keep push and pull_request checks independent. They target the same SHA
  # on PR branches; sharing a group cancels one run and leaves red checks.
  group: fld-db-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","windows-latest","macos-15"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          mkdir -p ci-logs
          dotnet restore Fld.Db.slnx 2>&1 | tee ci-logs/restore.log

      - name: Build Release
        shell: bash
        run: dotnet build Fld.Db.slnx --configuration Release --no-restore 2>&1 | tee ci-logs/build.log

      - name: Run tests
        shell: bash
        run: dotnet test Fld.Db.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=fld-tests.trx" 2>&1 | tee ci-logs/test.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fld-ci-logs-${{ matrix.os }}
          path: ci-logs/*.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fld-test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  update-binsync-storage-pin:
    name: publish tested FLD Storage pin to BIN-SYNC
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/crash-consistency-outbox'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIN_SYNC_PUSH_TOKEN: ${{ secrets.BIN_SYNC_PUSH_TOKEN }}
      FLD_STORAGE_SHA: ${{ github.sha }}
    steps:
      - name: Check cross-repository write credential
        id: credential
        shell: bash
        run: |
          if [[ -z "$BIN_SYNC_PUSH_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BIN_SYNC_PUSH_TOKEN is not configured; BIN-SYNC submodule update was skipped."
            {
              echo "### BIN-SYNC submodule update skipped"
              echo
              echo "Add repository secret `BIN_SYNC_PUSH_TOKEN` to FLD-DB. It must be a fine-grained token with Contents: Read and write access to smersh1307n2/BIN-SYNC."
              echo "The FLD-DB tests passed, but this run did not publish the new Storage pin."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout BIN-SYNC integration branch
        if: steps.credential.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: smersh1307n2/BIN-SYNC
          ref: feature/fld-external-storage
          token: ${{ secrets.BIN_SYNC_PUSH_TOKEN }}
          path: bin-sync
          submodules: recursive
          fetch-depth: 1

      - name: Advance pinned FLD Storage submodule
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C bin-sync/external/Fld1.Storage fetch origin "$FLD_STORAGE_SHA" --depth=1
          git -C bin-sync/external/Fld1.Storage checkout --detach "$FLD_STORAGE_SHA"
          git -C bin-sync add external/Fld1.Storage

          if git -C bin-sync diff --cached --quiet; then
            echo "BIN-SYNC already pins FLD Storage at $FLD_STORAGE_SHA."
            echo "No BIN-SYNC commit was necessary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git -C bin-sync config user.name "github-actions[bot]"
          git -C bin-sync config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C bin-sync commit -m "Update FLD Storage pin to $FLD_STORAGE_SHA"
          git -C bin-sync push origin HEAD:refs/heads/feature/fld-external-storage

          {
            echo "### FLD Storage pin published to BIN-SYNC"
            echo
            echo "- FLD-DB commit: `$FLD_STORAGE_SHA`"
            echo "- BIN-SYNC branch: `feature/fld-external-storage`"
            echo "- BIN-SYNC CI is triggered by the branch update; the pin is not considered validated until that CI passes."
          } >> "$GITHUB_STEP_SUMMARY"
