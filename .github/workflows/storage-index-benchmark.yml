name: Storage index scaling benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/Fld1.Storage/**"
      - "bench/Fld1.Engine.Bench/StorageIndexBench.cs"
      - "bench/Fld1.Engine.Bench/Program.cs"
      - "eng/verify-storage-index-benchmark.py"

permissions:
  contents: read

jobs:
  storage-index-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore bench/Fld1.Engine.Bench/Fld1.Engine.Bench.csproj
      - name: Run Storage index scaling matrix
        run: dotnet run --project bench/Fld1.Engine.Bench/Fld1.Engine.Bench.csproj --configuration Release --no-restore -- --storage-index-only
      - name: Verify all benchmark cases produced measurements
        run: python3 eng/verify-storage-index-benchmark.py
      - name: Upload BenchmarkDotNet reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-index-benchmark-${{ github.sha }}
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: error
          retention-days: 30
